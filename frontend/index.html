<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusPath · 智慧校园室内导航</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   CampusPath v2.0 — Dark Sci-Fi Design System
   ============================================================ */
:root {
  --bg-deep: #0a0e27;
  --bg-mid: #141832;
  --bg-card: rgba(255,255,255,0.04);
  --bg-card-hover: rgba(255,255,255,0.07);
  --border-subtle: rgba(255,255,255,0.06);
  --border-glow: rgba(59,130,246,0.25);
  --primary: #3b82f6;
  --primary-glow: rgba(59,130,246,0.35);
  --accent: #06b6d4;
  --accent-glow: rgba(6,182,212,0.3);
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accessible: #22c55e;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  font-family:"Microsoft YaHei",Arial,sans-serif;
  background:linear-gradient(135deg,#0a0e27 0%,#101530 35%,#141832 65%,#1a1f3a 100%);
  background-attachment:fixed;
  color:var(--text-primary);
}
.hidden{display:none!important}

/* ---- Navbar ---- */
.topbar{
  background:linear-gradient(135deg,#1e3a8a,#1d4ed8,#3b82f6);
  color:#fff;box-shadow:0 4px 30px rgba(59,130,246,0.3);
  position:sticky;top:0;z-index:1050;
}
.topbar .navbar-brand{font-weight:700;font-size:1.15rem;letter-spacing:0.5px}
.topbar .nav-link{
  color:rgba(255,255,255,0.85);border-radius:10px;
  padding:6px 13px;font-size:13px;white-space:nowrap;
  transition:all 0.2s;
}
.topbar .nav-link:hover,.topbar .nav-link.active{
  color:#fff;background:rgba(255,255,255,0.16);
  box-shadow:0 0 12px rgba(255,255,255,0.08);
}

/* ---- Cards ---- */
.card-custom{
  background:var(--bg-card);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border-subtle);border-radius:20px;
  box-shadow:0 8px 32px rgba(0,0,0,0.35);margin-bottom:20px;
  transition:border-color 0.3s,box-shadow 0.3s;
}
.card-custom:hover{border-color:var(--border-glow);box-shadow:0 8px 40px rgba(59,130,246,0.12)}
.card-custom .card-header{
  background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border-subtle);
  color:var(--text-primary);font-weight:600;border-radius:20px 20px 0 0!important;padding:14px 20px;
}
.card-custom .card-body{padding:20px}

/* ---- Stat Cards ---- */
.stat-card{
  background:var(--bg-card);backdrop-filter:blur(12px);
  border:1px solid var(--border-subtle);border-radius:18px;
  box-shadow:0 6px 20px rgba(0,0,0,0.25);
  transition:all 0.3s ease;cursor:default;overflow:hidden;
}
.stat-card:hover{
  transform:translateY(-4px);border-color:var(--border-glow);
  box-shadow:0 12px 40px var(--primary-glow);
}
.stat-icon{
  width:46px;height:46px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:20px;
  background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(6,182,212,0.15));
  color:var(--primary);
}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:8px}
.stat-value{font-size:26px;font-weight:800;color:var(--text-primary)}

/* ---- Buttons ---- */
.btn-rounded{border-radius:12px;font-weight:600;padding:8px 20px;min-height:42px;transition:all 0.25s}
.btn-primary{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  border:none;box-shadow:0 4px 16px rgba(59,130,246,0.3);
}
.btn-primary:hover{
  background:linear-gradient(135deg,#1d4ed8,#2563eb);
  box-shadow:0 6px 24px rgba(59,130,246,0.45);transform:translateY(-1px);
}
.btn-accent{
  background:linear-gradient(135deg,#0891b2,#06b6d4);border:none;color:#fff;
  box-shadow:0 4px 16px rgba(6,182,212,0.25);
}
.btn-accent:hover{box-shadow:0 6px 24px rgba(6,182,212,0.4);color:#fff}
.btn-success-accessible{
  background:linear-gradient(135deg,#16a34a,#22c55e);border:none;color:#fff;
  box-shadow:0 4px 16px rgba(34,197,94,0.25);
}
.btn-success-accessible:hover{box-shadow:0 6px 24px rgba(34,197,94,0.4);color:#fff}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:8px;min-height:28px}

/* ---- Tables ---- */
.table-custom{color:var(--text-primary)}
.table-custom thead th{
  background:rgba(59,130,246,0.08);color:var(--primary);
  font-size:12px;text-transform:uppercase;letter-spacing:0.5px;
  border-bottom:2px solid var(--border-glow);
}
.table-custom tbody td{vertical-align:middle;font-size:13px;border-color:var(--border-subtle)}
.table-custom tbody tr{transition:background 0.2s}
.table-custom tbody tr:hover{background:var(--bg-card-hover)}

/* ---- Form controls ---- */
.form-control,.form-select{
  background:rgba(255,255,255,0.06);border:1px solid var(--border-subtle);
  color:var(--text-primary);border-radius:10px;font-size:13px;min-height:42px;
  transition:all 0.2s;
}
.form-control:focus,.form-select:focus{
  background:rgba(255,255,255,0.08);border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(59,130,246,0.15);color:var(--text-primary);
}
.form-control::placeholder{color:var(--text-muted)}
.form-select option{background:#1a1f3a;color:var(--text-primary)}
.form-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.form-range::-webkit-slider-runnable-track{background:rgba(59,130,246,0.2);border-radius:10px}
.form-range::-webkit-slider-thumb{background:var(--primary);box-shadow:0 0 10px var(--primary-glow)}

/* ---- Badges ---- */
.badge-primary{background:rgba(59,130,246,0.18);color:#93c5fd}
.badge-success{background:rgba(16,185,129,0.18);color:#6ee7b7}
.badge-warning{background:rgba(245,158,11,0.18);color:#fcd34d}
.badge-danger{background:rgba(239,68,68,0.18);color:#fca5a5}
.badge-accent{background:rgba(6,182,212,0.18);color:#67e8f9}
.badge-accessible{background:rgba(34,197,94,0.18);color:#86efac}

/* ---- Animations ---- */
.page-section{animation:fadeSlideIn 0.3s ease}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---- Canvas ---- */
.canvas-wrap{
  background:rgba(0,0,0,0.25);border-radius:16px;
  border:1px solid var(--border-subtle);overflow:hidden;position:relative;
}
.canvas-wrap canvas{display:block}

/* ---- Info bar ---- */
.info-bar{
  background:rgba(0,0,0,0.3);border:1px solid var(--border-subtle);
  border-radius:12px;padding:10px 18px;display:flex;gap:24px;flex-wrap:wrap;
  font-size:12px;color:var(--text-secondary);
}
.info-bar .val{color:var(--text-primary);font-weight:600}

/* ---- Direction steps ---- */
.dir-step{
  display:flex;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border-subtle);align-items:flex-start;
}
.dir-step:last-child{border-bottom:none}
.dir-step-num{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.dir-step-num.arrive{background:linear-gradient(135deg,#059669,#10b981)}
.dir-step-num.elevator{background:linear-gradient(135deg,#0891b2,#06b6d4)}
.dir-step-num.stairs{background:linear-gradient(135deg,#d97706,#f59e0b)}
.dir-step-num.accessible{background:linear-gradient(135deg,#16a34a,#22c55e)}
.dir-instruction{font-size:13px;color:var(--text-primary);line-height:1.5}
.dir-meta{font-size:11px;color:var(--text-muted);margin-top:2px}

/* ---- Toast ---- */
.toast-wrap{
  position:fixed;top:80px;right:24px;z-index:9999;
  display:flex;flex-direction:column;gap:8px;max-width:380px;
}
.toast-msg{
  background:rgba(15,23,42,0.95);backdrop-filter:blur(16px);
  border:1px solid var(--border-subtle);border-radius:14px;
  padding:12px 18px;font-size:13px;color:var(--text-primary);
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
  animation:slideInRight 0.3s ease;display:flex;align-items:center;gap:10px;
}
@keyframes slideInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.toast-msg.error{border-left:3px solid var(--danger)}
.toast-msg.success{border-left:3px solid var(--success)}
.toast-msg.info{border-left:3px solid var(--primary)}

/* ---- Floor tabs ---- */
.floor-tab{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:10px;
  border:1px solid var(--border-subtle);background:var(--bg-card);
  color:var(--text-secondary);font-size:13px;font-weight:600;
  cursor:pointer;transition:all 0.2s;margin:2px;
}
.floor-tab:hover{border-color:var(--primary);color:var(--primary)}
.floor-tab.active{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  border-color:var(--primary);color:#fff;box-shadow:0 0 16px var(--primary-glow);
}

/* ---- SmartNav Scene Tabs ---- */
.scene-tab{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 14px;border-radius:10px;
  border:1px solid var(--border-subtle);background:var(--bg-card);
  color:var(--text-secondary);font-size:12px;font-weight:600;
  cursor:pointer;transition:all 0.2s;margin:2px;
}
.scene-tab:hover{border-color:var(--accent);color:var(--accent)}
.scene-tab.active{
  background:linear-gradient(135deg,#0891b2,#06b6d4);
  border-color:var(--accent);color:#fff;box-shadow:0 0 16px var(--accent-glow);
}
.scene-tab .scene-badge{font-size:10px;opacity:0.8}

/* ---- SmartNav Sidebar ---- */
.sm-sidebar{max-height:calc(100vh - 160px);overflow-y:auto;padding-right:4px}
.sm-sidebar::-webkit-scrollbar{width:4px}
.sm-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px}

/* ---- SmartNav traffic indicators ---- */
.traffic-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.traffic-dot.normal{background:#10b981;box-shadow:0 0 6px rgba(16,185,129,0.5)}
.traffic-dot.moderate{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,0.5)}
.traffic-dot.heavy{background:#f97316;box-shadow:0 0 6px rgba(249,115,22,0.5)}
.traffic-dot.blocked{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,0.5)}

/* ---- Vehicle row ---- */
.vehicle-row{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--border-subtle);font-size:13px;
}
.vehicle-row:last-child{border-bottom:none}
.vehicle-bar{
  flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;
}
.vehicle-bar-fill{
  height:100%;background:linear-gradient(90deg,#3b82f6,#06b6d4);border-radius:3px;
  transition:width 0.3s;
}

/* ---- SSE indicator ---- */
.sse-indicator{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.sse-dot{width:8px;height:8px;border-radius:50%;background:#64748b}
.sse-dot.connected{background:#10b981;box-shadow:0 0 8px rgba(16,185,129,0.6);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}

/* ---- SmartNav alert list ---- */
.alert-list{max-height:200px;overflow-y:auto;font-size:12px}
.alert-item{padding:6px 10px;border-radius:8px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.alert-item.info{background:rgba(59,130,246,0.1);border-left:2px solid var(--primary)}
.alert-item.warning{background:rgba(245,158,11,0.1);border-left:2px solid var(--warning)}
.alert-item.danger{background:rgba(239,68,68,0.1);border-left:2px solid var(--danger)}
.alert-item.success{background:rgba(16,185,129,0.1);border-left:2px solid var(--success)}

/* ---- Canvas tooltip ---- */
.canvas-tooltip{
  position:absolute;background:rgba(15,23,42,0.95);border:1px solid var(--border-glow);
  border-radius:10px;padding:8px 12px;font-size:12px;color:var(--text-primary);
  pointer-events:none;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,0.5);
  white-space:nowrap;display:none;
}
.floor-tab.all-floors{padding:0 12px;width:auto;font-size:11px}

/* ---- Quick Action ---- */
.quick-action{
  display:flex;align-items:center;gap:10px;padding:12px 18px;
  border-radius:14px;background:var(--bg-card);
  border:1px solid var(--border-subtle);color:var(--text-primary);
  font-size:13px;font-weight:500;cursor:pointer;
  transition:all 0.25s;text-decoration:none;
}
.quick-action:hover{
  background:var(--bg-card-hover);border-color:var(--border-glow);
  box-shadow:0 4px 20px rgba(59,130,246,0.12);
  transform:translateY(-2px);color:var(--text-primary);
}
.quick-action i{font-size:20px;color:var(--primary)}

/* ---- Benchmark ---- */
.best-val{color:var(--success);font-weight:700}

/* ---- Mini card ---- */
.dash-card-mini{
  border:1px solid var(--border-subtle);border-radius:12px;
  padding:10px 14px;margin-bottom:8px;transition:box-shadow 0.15s;
}
.dash-card-mini:hover{box-shadow:0 2px 8px rgba(59,130,246,0.15)}
.dash-card-mini:last-child{margin-bottom:0}

/* ---- Accordion ---- */
.accordion-custom .accordion-item{
  background:var(--bg-card);border:1px solid var(--border-subtle);
  border-radius:14px!important;margin-bottom:8px;overflow:hidden;
}
.accordion-custom .accordion-button{
  background:rgba(255,255,255,0.03);color:var(--text-primary);
  font-weight:600;font-size:14px;box-shadow:none;border-radius:14px!important;
}
.accordion-custom .accordion-button:not(.collapsed){
  background:rgba(59,130,246,0.08);color:var(--primary);
}
.accordion-custom .accordion-button::after{filter:invert(0.6)}
.accordion-custom .accordion-body{color:var(--text-secondary);font-size:13px;line-height:1.7}

/* ---- Search Autocomplete (NEW) ---- */
.search-wrap{position:relative}
.search-wrap .search-dropdown{
  position:absolute;top:100%;left:0;right:0;z-index:1000;
  max-height:260px;overflow-y:auto;
  background:rgba(15,23,42,0.98);backdrop-filter:blur(20px);
  border:1px solid var(--border-glow);border-radius:0 0 12px 12px;
  box-shadow:0 12px 40px rgba(0,0,0,0.5);
}
.search-wrap .search-item{
  padding:8px 14px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border-subtle);
  display:flex;justify-content:space-between;align-items:center;
  transition:background 0.15s;
}
.search-wrap .search-item:hover,.search-wrap .search-item.active{background:rgba(59,130,246,0.12)}
.search-wrap .search-item:last-child{border-bottom:none}
.search-wrap .search-item .si-name{color:var(--text-primary);font-weight:500}
.search-wrap .search-item .si-id{color:var(--text-muted);font-size:11px}
.search-wrap .search-item .si-floor{font-size:10px}

/* ---- Animation Controls (NEW) ---- */
.anim-ctrl{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 14px;background:rgba(0,0,0,0.2);border-radius:12px;
  border:1px solid var(--border-subtle);
}
.anim-ctrl button{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border-subtle);
  background:var(--bg-card);color:var(--text-primary);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  transition:all 0.15s;
}
.anim-ctrl button:hover{background:var(--bg-card-hover);border-color:var(--primary)}
.anim-ctrl button.active-btn{background:var(--primary);border-color:var(--primary);color:#fff}
.anim-ctrl .speed-label{font-size:11px;color:var(--text-muted);white-space:nowrap}
.anim-ctrl input[type=range]{width:80px}

/* ---- Multi-Floor Canvas (NEW) ---- */
.multi-floor-wrap{position:relative;overflow-y:auto;max-height:600px}
.multi-floor-wrap .floor-label-strip{
  position:sticky;top:0;z-index:10;background:rgba(15,23,42,0.95);
  border-bottom:1px solid var(--border-subtle);padding:6px 14px;
  font-size:12px;font-weight:600;color:var(--primary);
  display:flex;justify-content:space-between;align-items:center;
}

/* ---- Room Detail Modal (NEW) ---- */
.modal-dark .modal-content{
  background:rgba(15,23,42,0.98);backdrop-filter:blur(20px);
  border:1px solid var(--border-glow);border-radius:20px;
  color:var(--text-primary);
}
.modal-dark .modal-header{border-bottom:1px solid var(--border-subtle)}
.modal-dark .modal-footer{border-top:1px solid var(--border-subtle)}
.modal-dark .btn-close{filter:invert(0.8)}
.room-feature-tag{
  display:inline-block;padding:3px 10px;margin:2px;border-radius:20px;
  font-size:11px;background:rgba(59,130,246,0.12);color:#93c5fd;
  border:1px solid rgba(59,130,246,0.2);
}

/* ---- Pseudocode (NEW) ---- */
.pseudo-block{
  background:rgba(0,0,0,0.3);border:1px solid var(--border-subtle);
  border-radius:14px;padding:16px 20px;margin:10px 0;
  font-family:"Cascadia Code","Fira Code","Consolas",monospace;
  font-size:12px;line-height:1.8;color:var(--text-secondary);
  overflow-x:auto;white-space:pre;
}
.pseudo-block .kw{color:#93c5fd}
.pseudo-block .fn{color:#67e8f9}
.pseudo-block .cm{color:var(--text-muted);font-style:italic}
.pseudo-block .str{color:#6ee7b7}
.pseudo-block .num{color:#fcd34d}

/* ---- Isolated node highlight ---- */
.isolated-badge{
  animation:pulse-red 2s infinite;
}
@keyframes pulse-red{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}
  50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}
}

/* ---- Sort toggle ---- */
.sort-toggle{cursor:pointer;user-select:none;transition:color 0.2s}
.sort-toggle:hover{color:var(--primary)}
.sort-toggle.active-sort{color:var(--primary);font-weight:700}

@media(max-width:768px){.page-area{padding:12px!important}.stat-card .stat-value{font-size:20px}}
</style>
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg topbar">
<div class="container-fluid px-3 px-lg-4">
<a class="navbar-brand" href="javascript:void(0)" onclick="navigate('dashboard')">
  <i class="fa-solid fa-location-dot me-2"></i>CampusPath v2.0
</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
  <span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="mainNav">
  <ul class="navbar-nav me-auto" id="nav_tabs"></ul>
  <span class="small text-white-50" id="top_time"></span>
</div>
</div>
</nav>

<!-- ============ TOAST ============ -->
<div class="toast-wrap" id="toast_area"></div>

<!-- ============ ROOM DETAIL MODAL ============ -->
<div class="modal fade modal-dark" id="roomDetailModal" tabindex="-1">
<div class="modal-dialog modal-lg"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title"><i class="fa-solid fa-door-open me-2"></i><span id="rmd_title">房间详情</span></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body" id="rmd_body"></div>
<div class="modal-footer">
  <button class="btn btn-primary btn-rounded btn-sm" onclick="jumpToNav($('#rmd_node_id').textContent,'')" data-bs-dismiss="modal"><i class="fa-solid fa-location-crosshairs me-1"></i>设为此处起点</button>
  <button class="btn btn-outline-light btn-rounded btn-sm" data-bs-dismiss="modal">关闭</button>
</div>
</div></div></div>

<!-- ============ PAGE AREA ============ -->
<main class="page-area container-fluid px-3 px-lg-4 py-3" id="page_area"></main>

<script>
/* ============================================================
   CampusPath v2.0 — SPA Core
   ============================================================ */
var currentPage='dashboard',API_BASE='',_charts={};
var _currentAlgo='dijkstra',_currentHeuristic='euclidean';
var _navStart=null,_navGoal=null;

function $(id){return document.getElementById(id)}
function $$(sel){return document.querySelector(sel)}
function $$$(sel){return document.querySelectorAll(sel)}
function esc(s){var d=document.createElement('div');d.textContent=(s===null||s===undefined)?'':String(s);return d.innerHTML}
function fmtNum(v){return Number(v||0).toFixed(2)}
function fmtDist(v){return Number(v||0).toFixed(1)+' m'}
function fmtInt(v){return Math.round(Number(v||0))}

function toast(msg,type){
  type=type||'info';var area=$('toast_area');if(!area)return;
  var d=document.createElement('div');d.className='toast-msg '+type;
  var icons={success:'fa-circle-check',error:'fa-circle-exclamation',info:'fa-circle-info'};
  d.innerHTML='<i class="fa-solid '+(icons[type]||icons.info)+'"></i> '+esc(msg);
  area.appendChild(d);
  setTimeout(function(){d.style.opacity='0';d.style.transition='opacity 0.3s';
    setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},300);
  },4000);
}

async function api(url,opts){
  opts=opts||{};var headers={'Content-Type':'application/json'};
  var fetchOpts={method:opts.method||'GET',headers:headers};
  if(opts.body)fetchOpts.body=JSON.stringify(opts.body);
  try{var r=await fetch(API_BASE+url,fetchOpts);return await r.json()}
  catch(e){return{success:false,message:'网络错误: '+e.message}}
}

/* ---- SPA Navigation ---- */
function navigate(pid){currentPage=pid;buildNavTabs();renderPage(pid);window.scrollTo({top:0,behavior:'smooth'})}

function buildNavTabs(){
  var tabs=[
    {id:'dashboard',icon:'chart-pie',label:'导航仪表盘'},
    {id:'navigate',icon:'map-location-dot',label:'路径导航'},
    {id:'directory',icon:'magnifying-glass',label:'房间目录'},

function renderPage(pid){
  Object.keys(_charts).forEach(function(k){if(_charts[k]){_charts[k].destroy();_charts[k]=null}});
  _charts={};
  var h='';
  switch(pid){
    case 'dashboard':h=renderDashboard();break;
    case 'navigate':h=renderNavigate();break;
    case 'directory':h=renderDirectory();break;
    case 'benchmark':h=renderBenchmark();break;
    case 'accessible':h=renderAccessible();break;
    case 'validate':h=renderValidate();break;
    case 'smartnav':h=renderSmartNav();break;
    case 'about':h=renderAbout();break;
    default:h=renderDashboard();
  }
  $('page_area').innerHTML='<div class="page-section">'+h+'</div>';
  if(pid==='dashboard')loadDashboard();
  if(pid==='navigate')initNavigate();
  if(pid==='directory')loadDirectory();
  if(pid==='benchmark')loadBenchmark();
  if(pid==='accessible')initAccessible();
  if(pid==='validate')loadValidate();
  if(pid==='smartnav')initSmartNav();
}

var _mapRenderer=null,_animator=null,_currentFloor=1,_floorData=null,_allNodes=[];
var _viewMode='single',_multiRenderers=[],_savedSearchState=null;

function onAlgoChange(){
  var wrap=$('nav_heur_wrap');if(!wrap)return;
  wrap.style.display=$('nav_algo').value==='a_star'?'block':'none';
}

function onViewModeChange(){
  _viewMode=$('view_mode').value;
  if(_viewMode==='multi'){
    $('nav_canvas_wrap').classList.add('hidden');
    $('multi_floor_wrap').classList.remove('hidden');
    renderMultiFloor();
  }else{
    $('nav_canvas_wrap').classList.remove('hidden');
    $('multi_floor_wrap').classList.add('hidden');
  }
}

/* ---- Search Autocomplete ---- */
var _searchIdx=0;
function onSearchInput(which){
  var input=$('nav_'+which+'_input'),dd=$('nav_'+which+'_dd');
  var q=(input.value||'').toLowerCase().trim();
  if(!q){dd.classList.add('hidden');return}
  var matches=_allNodes.filter(function(n){
    return n.name.toLowerCase().indexOf(q)>=0 || n.node_id.toLowerCase().indexOf(q)>=0;
  }).slice(0,15);
  if(matches.length===0){dd.classList.add('hidden');return}
  _searchIdx=0;
  dd.innerHTML=matches.map(function(m,i){
    return'<div class="search-item'+(i===0?' active':'')+'" data-idx="'+i+'" data-nid="'+esc(m.node_id)+'" onmousedown="selectSearchItem(\''+which+'\',\''+esc(m.node_id)+'\')">'+
      '<span class="si-name">'+esc(m.name)+'</span><span class="si-id">'+esc(m.node_id)+'</span><span class="badge badge-accent si-floor">'+m.floor+'F</span></div>';
  }).join('');
  dd.classList.remove('hidden');
}

function onSearchKey(e,which){
  var dd=$('nav_'+which+'_dd');if(dd.classList.contains('hidden'))return;
  var items=dd.querySelectorAll('.search-item');
  if(e.key==='ArrowDown'){e.preventDefault();_searchIdx=Math.min(_searchIdx+1,items.length-1);updateSearchActive(items)}
  else if(e.key==='ArrowUp'){e.preventDefault();_searchIdx=Math.max(_searchIdx-1,0);updateSearchActive(items)}
  else if(e.key==='Enter'){e.preventDefault();if(items[_searchIdx])selectSearchItem(which,items[_searchIdx].dataset.nid)}
  else if(e.key==='Escape'){dd.classList.add('hidden')}
}

function updateSearchActive(items){
  items.forEach(function(it,i){it.classList.toggle('active',i===_searchIdx)});
}

function selectSearchItem(which,nid){
  $('nav_'+which+'_input').value=nid;
  $('nav_'+which+'_dd').classList.add('hidden');
  if(which==='start')_navStart=nid;else _navGoal=nid;
}

async function initNavigate(){
  var r=await api('/api/building/all-nodes');
  if(!r.success){toast('加载节点失败: '+r.message,'error');return}
  _allNodes=(r.data.nodes||[]).sort(function(a,b){return a.floor!==b.floor?a.floor-b.floor:a.node_id.localeCompare(b.node_id)});
  if($('nav_start_input')){$('nav_start_input').value=_navStart||''}
  if($('nav_goal_input')){$('nav_goal_input').value=_navGoal||''}
  var aEl=$('nav_algo');if(aEl)aEl.value=_currentAlgo;
  var hEl=$('nav_heuristic');if(hEl)hEl.value=_currentHeuristic;
  onAlgoChange();
  var bR=await api('/api/building');
  var floorsList=bR.success?bR.data.floors:[1,2,3,4];
  $('floor_tabs').innerHTML=floorsList.map(function(f){return '<span class="floor-tab'+(f===_currentFloor?' active':'')+'" onclick="switchFloor('+f+')">'+f+'F</span>'}).join('');
  initMap();await switchFloor(_currentFloor);
  if(_navStart&&_navGoal){await findPath();_navStart=null;_navGoal=null}
}

function initMap(){
  var canvas=$('nav_canvas');if(!canvas)return;
  _mapRenderer=new MapRenderer(canvas);_animator=new AlgorithmAnimator(_mapRenderer);
  canvas.addEventListener('click',function(e){
    var nid=_mapRenderer.hitTest(e.clientX,e.clientY);if(!nid)return;
    if(!_navStart||(_navStart&&_navGoal)){_navStart=nid;_navGoal=null;if($('nav_start_input'))$('nav_start_input').value=nid;if($('nav_goal_input'))$('nav_goal_input').value='';toast('已设置起点: '+nid,'info')}
    else{_navGoal=nid;if($('nav_goal_input'))$('nav_goal_input').value=nid;toast('已设置终点: '+nid,'info');findPath()}
  });
}

async function switchFloor(floor){
  _currentFloor=floor;
  document.querySelectorAll('#floor_tabs .floor-tab').forEach(function(t){t.classList.toggle('active',t.textContent===floor+'F')});
  if(_viewMode==='multi'){renderMultiFloor();return}
  var r=await api('/api/building/floor/'+floor);
  if(!r.success){toast('加载楼层失败','error');return}
  _floorData=r.data;if(_mapRenderer)_mapRenderer.loadFloor(_floorData);
  if(_savedSearchState){_mapRenderer.setState(_savedSearchState.state,_savedSearchState.path);_savedSearchState=null}
}

async function renderMultiFloor(){
  var bR=await api('/api/building');if(!bR.success)return;
  var floors=bR.data.floors;
  _multiRenderers=[];
  var html='';
  floors.forEach(function(f){
    html+='<div class="floor-label-strip"><span><i class="fa-solid fa-layer-group me-1"></i>'+f+'F</span><span class="text-muted small">点击节点设置起/终点</span></div>'+
      '<div class="canvas-wrap mb-1"><canvas id="mf_canvas_'+f+'" style="width:100%;height:260px"></canvas></div>';
  });
  $('multi_floor_wrap').innerHTML=html;
  // Load each floor
  for(var i=0;i<floors.length;i++){
    var f=floors[i];
    var r=await api('/api/building/floor/'+f);
    if(!r.success)continue;
    var canvas=$('mf_canvas_'+f);if(!canvas)continue;
    var renderer=new MapRenderer(canvas);renderer.loadFloor(r.data);
    _multiRenderers.push({floor:f,renderer:renderer});
    // Click handler
    (function(renderer,floor){
      canvas.addEventListener('click',function(e){
        var nid=renderer.hitTest(e.clientX,e.clientY);if(!nid)return;
        if(!_navStart||(_navStart&&_navGoal)){_navStart=nid;_navGoal=null;if($('nav_start_input'))$('nav_start_input').value=nid;if($('nav_goal_input'))$('nav_goal_input').value='';}
        else{_navGoal=nid;if($('nav_goal_input'))$('nav_goal_input').value=nid;}
        toast('已设置: '+nid+' ('+floor+'F)','info');
        // Highlight on all floors
        var st={};st[nid]=_navGoal?'goal':'start';if(_navStart)st[_navStart]='start';if(_navGoal)st[_navGoal]='goal';
        _multiRenderers.forEach(function(mr){mr.renderer.setState(st,[])});
        if(_navStart&&_navGoal)findPath();
      });
    })(renderer,f);
  }
  // If we have a saved search state, apply it
  if(_savedSearchState){
    _multiRenderers.forEach(function(mr){mr.renderer.setState(_savedSearchState.state,_savedSearchState.path)});
    _savedSearchState=null;
  }
}

/* ---- Animation Controls ---- */
function animPlay(){
  if(!_animator)return;
  if(_animator.currentStep<0){_animator.loadSteps(_animator.steps,_animator.finalPath)}
  if(_animator.play()){$('anim_ctrl').classList.remove('hidden');updateAnimUI()}
}

function animPause(){if(_animator)_animator.pause();updateAnimUI()}
function animStop(){
  if(_animator){_animator.stop();
    if(_mapRenderer&&_savedSearchState)_mapRenderer.setState(_savedSearchState.state,_savedSearchState.path)}
  updateAnimUI();$('anim_step_info').textContent='-/-';
}
function animStepFwd(){if(_animator){_animator.stepForward();updateAnimUI()}}
function animStepBack(){if(_animator){_animator.stepBackward();updateAnimUI()}}
function animSetSpeed(v){
  if(_animator)_animator.setSpeed(parseInt(v));
  var el=$('anim_speed_label');if(el)el.textContent=v+'ms';
}

function updateAnimUI(){
  if(!_animator)return;
  var el=$('anim_step_info');if(el)el.textContent=(_animator.currentStep+1)+'/'+_animator.steps.length;
}

async function findPath(){
  var start=$('nav_start_input').value.trim(),goal=$('nav_goal_input').value.trim();
  var algo=$('nav_algo').value,heur=$('nav_heuristic').value;
  if(!start||!goal){toast('请搜索并选择起点和终点','error');return}
  _navStart=start;_navGoal=goal;_currentAlgo=algo;_currentHeuristic=heur;
  api('/api/recent',{method:'POST',body:{start:start,goal:goal,algorithm:algo}});
  var r=await api('/api/path',{method:'POST',body:{start:start,goal:goal,algorithm:algo,heuristic:heur,record_steps:true}});
  if(!r.success){toast(r.message,'error');return}
  var d=r.data;
  $('ni_dist').textContent=fmtDist(d.total_distance);
  $('ni_visited').textContent=d.nodes_visited;
  $('ni_time').textContent=fmtNum(d.execution_time_ms)+' ms';
  $('ni_len').textContent=d.path?d.path.length:0;
  var state={};d.path.forEach(function(nid){state[nid]='path'});
  state[start]='start';state[goal]='goal';
  _savedSearchState={state:state,path:d.path};
  if(_viewMode==='multi'){
    _multiRenderers.forEach(function(mr){mr.renderer.setState(state,d.path)});
    var startNode=_allNodes.find(function(n){return n.node_id===start});
    if(startNode){var mf=$('multi_floor_wrap');if(mf){var strips=mf.querySelectorAll('.floor-label-strip');for(var i=0;i<strips.length;i++){if(strips[i].textContent.indexOf(startNode.floor+'F')===0){strips[i].scrollIntoView({behavior:'smooth'});break}}}}
  }else{
    if(_mapRenderer&&d.path){_mapRenderer.setState(state,d.path);
      var startNode2=_allNodes.find(function(n){return n.node_id===start});
      if(startNode2&&startNode2.floor!==_currentFloor){await switchFloor(startNode2.floor);_savedSearchState={state:state,path:d.path};_mapRenderer.setState(state,d.path)}
    }
    if(_animator&&d.steps&&d.steps.length>0){_animator.loadSteps(d.steps,d.path);$('anim_ctrl').classList.remove('hidden');updateAnimUI()}
    else{$('anim_ctrl').classList.add('hidden')}
  }
  var dirR=await api('/api/directions',{method:'POST',body:{path:d.path}});
  var dirPanel=$('dir_panel'),dirSteps=$('dir_steps');
  if(dirR.success&&dirPanel&&dirSteps){
    dirPanel.style.display='block';
    dirSteps.innerHTML=(dirR.data.directions||[]).map(function(dd){

async function runBenchmark(){
  var start=$('bm_start').value,goal=$('bm_goal').value;
  if(!start||!goal){toast('请选择起点和终点','error');return}
  var r=await api('/api/compare',{method:'POST',body:{start:start,goal:goal}});
  if(!r.success){toast(r.message,'error');return}
  var results=r.data.results||{},algos=Object.keys(results).filter(function(k){return!results[k].error});
  var labels=algos.map(function(k){return k.replace(/_/g,' ')});
  var distances=algos.map(function(k){return results[k].total_distance});
  var visited=algos.map(function(k){return results[k].nodes_visited});
  var times=algos.map(function(k){return results[k].execution_time_ms});
  ['bmDist','bmNodes','bmTime'].forEach(function(k){if(_charts[k]){_charts[k].destroy();_charts[k]=null}});
  var colors=['#3b82f6','#06b6d4','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899'];
  var chOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'}},
            y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'}}}};
  _charts.bmDist=new Chart($('bm_dist'),{type:'bar',data:{labels:labels,datasets:[{data:distances,backgroundColor:colors,borderRadius:6}]},options:chOpts});
  _charts.bmNodes=new Chart($('bm_nodes'),{type:'bar',data:{labels:labels,datasets:[{data:visited,backgroundColor:colors,borderRadius:6}]},options:chOpts});
  _charts.bmTime=new Chart($('bm_time'),{type:'bar',data:{labels:labels,datasets:[{data:times,backgroundColor:colors,borderRadius:6}]},options:chOpts});
  var bestDist=Math.min.apply(null,distances),bestNode=Math.min.apply(null,visited),bestTime=Math.min.apply(null,times);
  $('bm_table').innerHTML='<thead><tr><th>算法</th><th>距离 (m)</th><th>访问节点</th><th>耗时 (ms)</th><th>路径长度</th></tr></thead><tbody>'+
    algos.map(function(k,i){var v=results[k];
      return'<tr><td><code>'+esc(k)+'</code></td>'+
        '<td class="'+(v.total_distance===bestDist?'best-val':'')+'">'+fmtDist(v.total_distance)+'</td>'+
        '<td class="'+(v.nodes_visited===bestNode?'best-val':'')+'">'+v.nodes_visited+'</td>'+
        '<td class="'+(v.execution_time_ms===bestTime?'best-val':'')+'">'+fmtNum(v.execution_time_ms)+' ms</td>'+
        '<td>'+(v.path?v.path.length:0)+' 节点</td></tr>';
    }).join('')+'</tbody>';
  toast('基准测试完成','success');
}

var _acRenderer=null,_acFloor=1,_acAllNodes=[];

async function initAccessible(){
  var r=await api('/api/building/all-nodes');if(!r.success)return;
  _acAllNodes=(r.data.nodes||[]).sort(function(a,b){return a.node_id.localeCompare(b.node_id)});
  var opt='<option value="">-- 选择 --</option>';
  _acAllNodes.forEach(function(n){opt+='<option value="'+esc(n.node_id)+'">'+esc(n.name)+' ('+esc(n.node_id)+')</option>'});
  if($('ac_start'))$('ac_start').innerHTML=opt;if($('ac_goal'))$('ac_goal').innerHTML=opt;
  var bR=await api('/api/building');var floors=bR.success?bR.data.floors:[1,2,3,4];
  $('ac_floors').innerHTML=floors.map(function(f){return'<span class="floor-tab'+(f===_acFloor?' active':'')+'" onclick="switchAcFloor('+f+')">'+f+'F</span>'}).join('');
  var canvas=$('ac_canvas');if(canvas)_acRenderer=new AccessibleMapRenderer(canvas);
  await switchAcFloor(_acFloor);
}

async function switchAcFloor(floor){_acFloor=floor;
  document.querySelectorAll('#ac_floors .floor-tab').forEach(function(t){t.classList.toggle('active',t.textContent===floor+'F')});
  var r=await api('/api/building/floor/'+floor);if(r.success&&_acRenderer)_acRenderer.loadFloor(r.data);
}

async function findAccessible(){
  var start=$('ac_start').value,goal=$('ac_goal').value;
  if(!start||!goal){toast('请选择起点和终点','error');return}
  var waitTime=parseInt($('ac_wait').value)||0;
  var r=await api('/api/accessible-path',{method:'POST',body:{start:start,goal:goal,elevator_wait_time_s:waitTime}});
  if(!r.success){toast(r.message,'error');return}var d=r.data;
  displayAccessibleResult(d,start,goal);
}

async function findAccessibleNoWait(){
  var start=$('ac_start').value,goal=$('ac_goal').value;
  if(!start||!goal){toast('请选择起点和终点','error');return}
  $('ac_wait').value=0;$('ac_wait_val').textContent='0s';
  var r=await api('/api/accessible-path',{method:'POST',body:{start:start,goal:goal,elevator_wait_time_s:0}});
  if(!r.success){toast(r.message,'error');return}var d=r.data;
  displayAccessibleResult(d,start,goal);
}

function displayAccessibleResult(d,start,goal){
  $('ai_dist').textContent=fmtDist(d.total_distance);$('ai_visited').textContent=d.nodes_visited;
  $('ai_time').textContent=fmtNum(d.execution_time_ms)+' ms';
  $('ai_ok').textContent=d.accessible?'✓ 可通行':'✗ 不可通行';
  $('ai_ok').style.color=d.accessible?'var(--success)':'var(--danger)';
  $('ai_rides').textContent=(d.elevator_rides||0)+' 次';
  $('ai_total_time').textContent=d.estimated_total_time_s?fmtNum(d.estimated_total_time_s)+'s':'-';
  if(_acRenderer&&d.path){
    var state={};d.path.forEach(function(nid){state[nid]='path'});state[start]='start';state[goal]='goal';
    _acRenderer.setState(state,d.path);
    // Also mark elevators with wheelchair symbol
    _acRenderer.setAccessible(true);
  }
  var dirR=api('/api/directions',{method:'POST',body:{path:d.path}}).then(function(dirR){
    var panel=$('ac_dir_panel'),steps=$('ac_dir_steps');
    if(dirR.success&&panel&&steps){panel.style.display='block';
      steps.innerHTML=(dirR.data.directions||[]).map(function(dd){
        var cls=dd.action==='arrive'?'arrive':(dd.action==='take_elevator'?'accessible':'');
        return'<div class="dir-step"><div class="dir-step-num '+cls+'">'+(dd.action==='arrive'?'<i class="fa-solid fa-flag-checkered"></i>':(dd.action==='take_elevator'?'<i class="fa-solid fa-wheelchair"></i>':dd.step))+'</div><div><div class="dir-instruction">'+esc(dd.instruction)+'</div><div class="dir-meta">'+esc(dd.from_node.name)+' → '+esc(dd.to_node.name)+'</div></div></div>';
      }).join('')}
  });
  toast(d.accessible?'无障碍路径规划成功':'警告: 此路径不可通行','success');
}

async function compareAccessible(){
  var start=$('ac_start').value,goal=$('ac_goal').value;
  if(!start||!goal){toast('请选择起点和终点','error');return}
  var waitTime=parseInt($('ac_wait').value)||0;
  var results=await Promise.all([

  $('ac_dir_steps').innerHTML='<table class="table table-custom table-sm mb-0"><thead><tr><th>指标</th><th>标准路径</th><th>无障碍路径</th></tr></thead><tbody>'+

    '  visited ← 0\n'+
    '  <span class="kw">while</span> pq <span class="kw">not</span> empty:\n'+
    '    (d, u) ← pq.pop()\n'+

    '  <span class="kw">return</span> reconstruct_path(prev, goal)\n'+

    '  g[start] ← 0; f[start] ← h(start, goal)\n'+

    '        g[v] ← g_new; f[v] ← g_new + h(v, goal)\n'+

    '      <span class="kw">if</span> v <span class="kw">not in</span> visited:\n'+
    '        visited.add(v); prev[v] ← u\n'+
    '        queue.enqueue(v)\n'+
    '  <span class="kw">return</span> reconstruct_path(prev, goal)\n'+

    '  <span class="cm"># 访问节点 ~ 2·b^(d/2) vs BFS b^d</span></div></div></div></div>'+

    '    fwd_min ← fwd_pq.peak_min()\n'+

    '      <span class="kw">break</span> <span class="cm">// 终止条件</span>\n'+
    '    expand_smaller(fwd_pq, bwd_pq)\n'+
    '    update_best_dist()\n'+
    '  <span class="kw">return</span> best_path\n'+

/* ============================================================
   SMART NAV RENDERER — renders NavGraph maps on Canvas
   ============================================================ */
class SmartNavRenderer{
  constructor(canvas){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    this.nodes=[];this.edges=[];this.nodeMap={};
    this.state={};this.highlightPath=[];this.vehicles=[];
    this.scaleX=1;this.scaleY=1;this.offsetX=0;this.offsetY=0;
    this.minX=0;this.minY=0;this.maxX=1000;this.maxY=600;
    this.hoveredNode=null;this.tooltipEl=null;
    // Vehicle animation
    this._vehAnim={prev:{},target:{},smoothed:{},animId:null,lastTime:0,active:false};
    this._resize();window.addEventListener('resize',()=>this._resize());
  }
  _resize(){
    var dpr=window.devicePixelRatio||1;
    var rect=this.canvas.getBoundingClientRect();
    this.canvas.width=rect.width*dpr;this.canvas.height=rect.height*dpr;
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.viewW=rect.width;this.viewH=rect.height;
  }
  loadScene(nodes,edges){
    this.nodes=nodes||[];this.edges=edges||[];this.nodeMap={};
    for(var i=0;i<this.nodes.length;i++)this.nodeMap[this.nodes[i].node_id]=this.nodes[i];
    // Compute bounds
    if(this.nodes.length>0){
      this.minX=Infinity;this.minY=Infinity;this.maxX=-Infinity;this.maxY=-Infinity;
      for(var i=0;i<this.nodes.length;i++){
        var n=this.nodes[i];
        if(n.x<this.minX)this.minX=n.x;if(n.y<this.minY)this.minY=n.y;
        if(n.x>this.maxX)this.maxX=n.x;if(n.y>this.maxY)this.maxY=n.y;
      }
      var pad=40;this.offsetX=pad;this.offsetY=pad;
      this.scaleX=(this.viewW-pad*2)/(this.maxX-this.minX||1);
      this.scaleY=(this.viewH-pad*2)/(this.maxY-this.minY||1);
    }
    this.render();
  }
  _toPixel(nx,ny){return{x:(nx-this.minX)*this.scaleX+this.offsetX,y:(ny-this.minY)*this.scaleY+this.offsetY}}
  setState(state,path){this.state=state||{};this.highlightPath=path||[];this.render()}
  setVehicles(vehicles){
    var a=this._vehAnim;
    // Save current smoothed positions as previous for interpolation
    for(var i=0;i<vehicles.length;i++){
      var v=vehicles[i],vid=v.vehicle_id;
      a.target[vid]={x:v.x,y:v.y,name:v.name,vehicle_id:vid,
        status:v.status,speed_kmh:v.speed_kmh,route_path:v.route_path,
        current_position_index:v.current_position_index};
      if(!a.smoothed[vid])a.smoothed[vid]={x:v.x,y:v.y};
      a.prev[vid]={x:a.smoothed[vid].x,y:a.smoothed[vid].y};
    }
    // Clean up vehicles no longer present
    var keep={};
    for(var i=0;i<vehicles.length;i++)keep[vehicles[i].vehicle_id]=true;
    for(var k in a.prev)if(!keep[k]){delete a.prev[k];delete a.target[k];delete a.smoothed[k]}
    this.vehicles=vehicles;
    if(vehicles.length>0)this._startAnimation();
    else if(a.animId){cancelAnimationFrame(a.animId);a.animId=null;a.active=false}
  }
  setTraffic(trafficData){this.trafficData=trafficData||{};this.render()}
  render(){
    var ctx=this.ctx;ctx.clearRect(0,0,this.viewW,this.viewH);
    this._drawEdges();this._drawPathHighlight();this._drawNodes();this._drawVehicles();
  }
  _drawEdges(){
    var ctx=this.ctx;ctx.lineWidth=1.5;
    for(var i=0;i<this.edges.length;i++){
      var e=this.edges[i],p1=this._toPixel(this.nodeMap[e.from]?.x||0,this.nodeMap[e.from]?.y||0),p2=this._toPixel(this.nodeMap[e.to]?.x||0,this.nodeMap[e.to]?.y||0);
      if(!this.nodeMap[e.from]||!this.nodeMap[e.to])continue;
      // Check traffic
      var isBlocked=false,isCongested=false;
      if(this.trafficData){
        var key=e.from+'→'+e.to;
        if(this.trafficData.blockages){for(var b=0;b<this.trafficData.blockages.length;b++){if(this.trafficData.blockages[b].edge===key){isBlocked=true;break}}}
        if(this.trafficData.congested_details){for(var c=0;c<this.trafficData.congested_details.length;c++){if(this.trafficData.congested_details[c].from===e.from&&this.trafficData.congested_details[c].to===e.to){isCongested=true;break}}}
      }
      if(isBlocked){ctx.strokeStyle='rgba(239,68,68,0.6)';ctx.lineWidth=3;ctx.setLineDash([6,4])}
      else if(isCongested){ctx.strokeStyle='rgba(245,158,11,0.5)';ctx.lineWidth=2;ctx.setLineDash([])}
      else{ctx.strokeStyle='rgba(148,163,184,0.2)';ctx.lineWidth=1.5;ctx.setLineDash([])}
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  _drawNodes(){
    var ctx=this.ctx;
    var typeColors={entrance:'rgba(239,68,68,0.4)',road:'rgba(148,163,184,0.3)',intersection:'rgba(148,163,184,0.35)',
      poi:'rgba(245,158,11,0.4)',food:'rgba(16,185,129,0.35)',parking:'rgba(59,130,246,0.35)',
      station:'rgba(168,85,247,0.35)',scenic:'rgba(236,72,153,0.35)',default:'rgba(148,163,184,0.3)'};
    for(var i=0;i<this.nodes.length;i++){
      var n=this.nodes[i],p=this._toPixel(n.x,n.y),r=8;
      var state=this.state[n.node_id]||'normal',isStart=state==='start',isGoal=state==='goal';
      var cl=typeColors[n.type]||typeColors.default;
      // Draw node
      ctx.fillStyle=cl;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(148,163,184,0.25)';ctx.lineWidth=1;ctx.stroke();
      // Start/goal rings
      if(isStart||isGoal){ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,Math.PI*2);ctx.strokeStyle=isStart?'#10b981':'#ef4444';ctx.lineWidth=2.5;ctx.stroke()}
      // POI indicator
      if(n.poi_category){ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(p.x,p.y-9,3,0,Math.PI*2);ctx.fill()}
      // Label
      var label=(n.name||n.node_id).length>8?(n.name||n.node_id).slice(0,7)+'…':(n.name||n.node_id);
      ctx.fillStyle='#94a3b8';ctx.font='9px "Microsoft YaHei",Arial,sans-serif';ctx.textAlign='center';
      ctx.fillText(label,p.x,p.y+r+12);
    }
  }
  _drawPathHighlight(){
    if(this.highlightPath.length<2)return;var ctx=this.ctx;
    ctx.strokeStyle='#3b82f6';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.shadowColor='rgba(59,130,246,0.5)';ctx.shadowBlur=10;
    ctx.beginPath();
    for(var i=0;i<this.highlightPath.length;i++){
      var n=this.nodeMap[this.highlightPath[i]];if(!n)continue;
      var p=this._toPixel(n.x,n.y);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();ctx.shadowBlur=0;
  }
  _drawVehicles(){
    var a=this._vehAnim;var vehicleIds=Object.keys(a.smoothed);
    var colors=['#3b82f6','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4','#f97316'];
    for(var i=0;i<vehicleIds.length;i++){
      var vid=vehicleIds[i],s=a.smoothed[vid],t=a.target[vid];
      if(!t)continue;
      var p=this._toPixel(s.x,s.y),ctx=this.ctx;
      var color=colors[i%colors.length];
      var isRunning=t.status==='running';
      var r=6,alpha=isRunning?1:0.5;
      // ---- Route trail ----
      if(t.route_path&&t.current_position_index>0){
        ctx.strokeStyle='rgba(148,163,184,0.15)';ctx.lineWidth=2;ctx.setLineDash([3,6]);
        ctx.beginPath();var started=false;
        for(var j=0;j<=t.current_position_index&&j<t.route_path.length;j++){
          var tn=this.nodeMap[t.route_path[j]];if(!tn)continue;
          var tp=this._toPixel(tn.x,tn.y);
          if(!started){ctx.moveTo(tp.x,tp.y);started=true}else ctx.lineTo(tp.x,tp.y);
        }
        if(started){ctx.lineTo(p.x,p.y);ctx.stroke();ctx.setLineDash([])}
      }
      // ---- Direction cone ----
      if(isRunning&&t.route_path&&t.current_position_index+1<t.route_path.length){
        var nnid=t.route_path[t.current_position_index+1],nn=this.nodeMap[nnid];
        if(nn){
          var np=this._toPixel(nn.x,nn.y),dx=np.x-p.x,dy=np.y-p.y,dist=Math.sqrt(dx*dx+dy*dy);
          if(dist>1){dx/=dist;dy/=dist}
          // Draw direction arrow
          ctx.fillStyle=color;ctx.beginPath();
          var tipX=p.x+dx*(r+6),tipY=p.y+dy*(r+6);
          ctx.moveTo(tipX,tipY);
          ctx.lineTo(tipX-dx*8-dy*3.5,tipY-dy*8+dx*3.5);
          ctx.lineTo(tipX-dx*8+dy*3.5,tipY-dy*8-dx*3.5);
          ctx.closePath();ctx.fill();
        }
      }
      // ---- Vehicle body ----
      ctx.globalAlpha=alpha;ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.8;ctx.stroke();
      ctx.globalAlpha=1;
      // ---- Status ring ----
      if(isRunning){
        ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,Math.PI*2);ctx.stroke();
      }else{
        ctx.strokeStyle='rgba(148,163,184,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([2,2]);
        ctx.beginPath();ctx.arc(p.x,p.y,r+4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      }
      // ---- Label ----
      var label=(t.name||vid).length>6?(t.name||vid).slice(0,5)+'…':(t.name||vid);
      ctx.fillStyle='#e2e8f0';ctx.font='bold 9px "Microsoft YaHei",Arial,sans-serif';ctx.textAlign='center';
      ctx.fillText(label,p.x,p.y-r-9);
      // Speed badge
      if(isRunning){
        var speedText=Math.round(t.speed_kmh||0)+'km/h';
        ctx.fillStyle='rgba(15,23,42,0.85)';var tw=ctx.measureText(speedText).width+8;
        ctx.fillRect(p.x-tw/2,p.y+r+6,tw,14);
        ctx.fillStyle='#94a3b8';ctx.font='8px "Microsoft YaHei",Arial,sans-serif';
        ctx.fillText(speedText,p.x,p.y+r+17);
      }
    }
  }
  _startAnimation(){
    var a=this._vehAnim;if(a.animId)return;a.active=true;a.lastTime=0;
    var self=this;
    function step(now){
      if(!self._vehAnim.active){self._vehAnim.animId=null;return}
      var dt=a.lastTime?(now-a.lastTime)/1000:0.016;
      a.lastTime=now;self._interpolateVehicles(dt);
      var hasActive=false;
      for(var k in a.target)if(a.target[k].status==='running'){hasActive=true;break}
      if(hasActive||Object.keys(a.target).length>0)self.render();
      // Stop if no vehicles and all converged
      var allDone=Object.keys(a.target).length===0;
      for(var k in a.smoothed){var s=a.smoothed[k],t=a.target[k];if(t){var dx=Math.abs(s.x-t.x),dy=Math.abs(s.y-t.y);if(dx>0.1||dy>0.1)allDone=false}}
      if(allDone&&!hasActive){self._vehAnim.animId=null;self._vehAnim.active=false;self.render();return}
      self._vehAnim.animId=requestAnimationFrame(step);
    }
    this._vehAnim.animId=requestAnimationFrame(step);
  }
  _interpolateVehicles(dt){
    var a=this._vehAnim,factor=Math.min(dt*8,0.5); // smoothing factor
    for(var k in a.target){
      var t=a.target[k],s=a.smoothed[k];if(!s)continue;
      if(t.status==='running'){
        s.x+=(t.x-s.x)*factor;s.y+=(t.y-s.y)*factor;
      }else{
        // Stopped vehicles converge faster
        s.x+=(t.x-s.x)*factor*2;s.y+=(t.y-s.y)*factor*2;
      }
    }
  }
  hitTest(mx,my){
    var rect=this.canvas.getBoundingClientRect(),cx=mx-rect.left,cy=my-rect.top;
    for(var i=0;i<this.nodes.length;i++){
      var n=this.nodes[i],p=this._toPixel(n.x,n.y);
      var dx=cx-p.x,dy=cy-p.y;if(Math.sqrt(dx*dx+dy*dy)<14)return n.node_id;
    }
    return null;
  }
}

   SMART NAV PAGE — PAGE 8: 智慧导航

var _smRenderer=null,_smSceneId='',_smNodes=[],_smEdges=[];
var _smStart='',_smGoal='',_smMode='driving',_smAlgo='dijkstra',_smHeuristic='euclidean';

async function initSmartNav(){
  // Load metadata + scenes
  var metaR=await api('/api/smart/meta');
  if(!metaR.success){toast('加载SmartNav元数据失败','error');return}
  var scenes=metaR.data.scenes||[];
  _smSceneId=metaR.data.active_scene_id||(scenes.length>0?scenes[0].scene_id:'');
  // Render scene tabs
  var tabsHtml='';for(var i=0;i<scenes.length;i++){var s=scenes[i];tabsHtml+='<span class="scene-tab'+(s.scene_id===_smSceneId?' active':'')+'" data-scene="'+esc(s.scene_id)+'" onclick="smSwitchScene(\''+esc(s.scene_id)+'\')"><i class="fa-solid fa-map-pin"></i> '+esc(s.name)+' <span class="scene-badge">'+s.node_count+'/'+s.edge_count+'</span></span>'}$('sm_scenes').innerHTML=tabsHtml;
  // Init canvas
  if(!_smRenderer){var canvas=$('sm_canvas');if(canvas){_smRenderer=new SmartNavRenderer(canvas);canvas.addEventListener('click',function(e){var nid=_smRenderer.hitTest(e.clientX,e.clientY);if(!nid)return;if(!_smStart||(_smStart&&_smGoal)){_smStart=nid;_smGoal='';$('sm_start').value=nid;$('sm_goal').value='';toast('起点: '+nid,'info')}else{_smGoal=nid;$('sm_goal').value=nid;toast('终点: '+nid,'info')}});canvas.addEventListener('mousemove',function(e){var nid=_smRenderer.hitTest(e.clientX,e.clientY);if(nid){var n=_smRenderer.nodeMap[nid];if(n){var tt=$('sm_tooltip');tt.style.display='block';tt.style.left=(e.clientX-canvas.getBoundingClientRect().left+15)+'px';tt.style.top=(e.clientY-canvas.getBoundingClientRect().top-30)+'px';tt.innerHTML='<b>'+esc(n.name||nid)+'</b><br><small>'+esc(nid)+' · '+esc(n.type||'')+(n.floor?' · '+n.floor+'F':'')+'</small>'}}else{var tt=$('sm_tooltip');tt.style.display='none'}})}}
  // Load active scene
  await smLoadScene(_smSceneId);
  // Set dropdown values
  var modeSel=$('sm_mode');if(modeSel)modeSel.value=_smMode;
  var algoSel=$('sm_algo');if(algoSel){algoSel.value=_smAlgo;algoSel.addEventListener('change',function(){_smAlgo=this.value;var heurWrap=$('sm_heur_wrap');heurWrap.style.display=this.value==='a_star'?'block':'none'})}
  var heurSel=$('sm_heuristic');if(heurSel)heurSel.value=_smHeuristic;
  var heurWrap=$('sm_heur_wrap');if(heurWrap)heurWrap.style.display=_smAlgo==='a_star'?'block':'none';
  var modeSel2=$('sm_mode');if(modeSel2)modeSel2.addEventListener('change',function(){_smMode=this.value});
  // Auto-connect SSE
  smConnectSSE();
  // Refresh traffic
  await smRefreshTraffic();
}

async function smLoadScene(sceneId){
  _smSceneId=sceneId;
  // Activate on server
  await api('/api/smart/scenes/'+sceneId+'/activate',{method:'POST'});
  // Load graph data
  var r=await api('/api/smart/scenes/'+sceneId);
  if(!r.success){toast('加载场景失败','error');return}
  _smNodes=r.data.nodes||[];_smEdges=r.data.edges||[];
  // Update scene tabs
  document.querySelectorAll('#sm_scenes .scene-tab').forEach(function(t){t.classList.toggle('active',t.dataset.scene===sceneId)});
  if(_smRenderer){_smRenderer.loadScene(_smNodes,_smEdges);_smRenderer.setState({},[])}
  smRefreshTraffic();
}

async function smSwitchScene(sceneId){await smLoadScene(sceneId);toast('已切换场景: '+sceneId,'info')}

async function smFindPath(){
  var start=$('sm_start').value.trim(),goal=$('sm_goal').value.trim();
  if(!start||!goal){toast('请设置起点和终点','warning');return}
  _smStart=start;_smGoal=goal;
  _smMode=$('sm_mode').value;_smAlgo=$('sm_algo').value;_smHeuristic=$('sm_heuristic').value;
  var body={start:start,goal:goal,transport_mode:_smMode,algorithm:_smAlgo,heuristic:_smHeuristic,scene_id:_smSceneId};
  var r=await api('/api/smart/path',{method:'POST',body:body});
  if(!r.success){toast('寻路失败: '+r.message,'error');return}
  var p=r.data.result;
  $('sm_dist').textContent=p.total_distance.toFixed(0)+' m';
  $('sm_visited').textContent=p.nodes_visited||0;
  $('sm_time').textContent=(p.total_time||0).toFixed(1)+' s';
  $('sm_cost').textContent='¥'+(p.total_cost||0).toFixed(2);
  $('sm_path_len').textContent=p.path_length||0;
  // Highlight on renderer
  var state={};if(start)state[start]='start';if(goal)state[goal]='goal';
  if(_smRenderer)_smRenderer.setState(state,p.path||[]);
  // Show path steps
  if(p.path_coords&&p.path_coords.length>0){
    var stepsHtml='<div class="dir-step"><div class="dir-step-num">1</div><div class="dir-instruction"><b>起点:</b> '+esc(p.path_coords[0].name||start)+'</div></div>';
    for(var i=1;i<p.path_coords.length;i++){var c=p.path_coords[i];stepsHtml+='<div class="dir-step"><div class="dir-step-num">'+(i+1)+'</div><div class="dir-instruction">'+esc(c.name||c.node_id)+(c.floor!==undefined?' <small class="text-muted">('+c.floor+'F)</small>':'')+'<div class="dir-meta">'+esc(c.node_id)+'</div></div></div>'}
    $('sm_path_steps').innerHTML=stepsHtml;$('sm_path_detail').style.display='block';
  }
}

async function smCompareAll(){
  var start=$('sm_start').value.trim(),goal=$('sm_goal').value.trim();
  if(!start||!goal){toast('请设置起点和终点','warning');return}
  _smMode=$('sm_mode').value;
  var r=await api('/api/smart/compare',{method:'POST',body:{start:start,goal:goal,transport_mode:_smMode,scene_id:_smSceneId}});
  if(!r.success){toast('对比失败: '+r.message,'error');return}
  // Build comparison table
  var results=r.data.results||[],summary=r.data.summary||{};
  var rows=results.map(function(p){return'<tr><td><b>'+esc(p.algorithm)+'</b></td><td>'+(p.total_distance||0).toFixed(0)+' m</td><td>'+(p.nodes_visited||0)+'</td><td>'+(p.execution_time_ms||0).toFixed(1)+' ms</td><td>'+(p.path_length||0)+'</td><td>'+(p.is_reachable?'<span class="badge badge-success">可达</span>':'<span class="badge badge-danger">不可达</span>')+'</td></tr>'}).join('');
  $('sm_path_steps').innerHTML='<div class="table-responsive"><table class="table table-custom table-sm mb-0"><thead><tr><th>算法</th><th>距离</th><th>访问节点</th><th>耗时</th><th>路径长</th><th>状态</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="mt-2 small text-secondary">最短距离: <b class="text-primary">'+(summary.shortest_distance||0).toFixed(0)+' m</b> | 最快: <b class="text-primary">'+(summary.fastest_path||0).toFixed(1)+' s</b> | 最少探索: <b class="text-primary">'+(summary.least_visited||0)+'</b></div>';
  $('sm_path_detail').style.display='block';
  // Highlight best path
  var best=null;for(var i=0;i<results.length;i++){if(results[i].is_reachable&&(!best||results[i].total_distance<best.total_distance))best=results[i]}
  if(best&&_smRenderer){var state={};state[start]='start';state[goal]='goal';_smRenderer.setState(state,best.path||[])}
}

async function smSearchNearby(){
  var cat=$('sm_poi_cat').value,radius=$('sm_poi_radius').value;
  var params='scene_id='+_smSceneId;
  if(_smStart)params+='&center_node='+_smStart;
  if(cat)params+='&categories='+cat;
  if(radius)params+='&radius='+radius;
  var r=await api('/api/smart/search/nearby?'+params);
  if(!r.success){toast('搜索失败','error');return}
  var results=r.data.results||[];
  var html='';for(var i=0;i<results.length;i++){var p=results[i];html+='<div class="d-flex justify-content-between align-items-center mb-1" style="cursor:pointer" onclick="$(\'sm_goal\').value=\''+esc(p.node_id)+'\';_smGoal=\''+esc(p.node_id)+'\';toast(\'终点: '+esc(p.name)+'\',\'info\')"><span><span class="badge badge-accent me-1">'+esc(p.category_label||p.category)+'</span>'+esc(p.name)+'</span><span class="text-muted">'+p.distance.toFixed(0)+'m '+esc(p.direction||'')+'</span></div>'}$('sm_poi_results').innerHTML=html||'<p class="text-muted small">无结果</p>';
  // Highlight POIs on map
  if(_smRenderer&&results.length>0){var state={};for(var i=0;i<results.length;i++)state[results[i].node_id]='poi';if(_smStart)state[_smStart]='start';_smRenderer.setState(state,[])}
}

async function smRefreshTraffic(){
  var r=await api('/api/smart/traffic');
  if(!r.success)return;_smTrafficData=r.data;
  var congested=r.data.congested_edges||0,blocked=r.data.blocked_edges||0;
  $('sm_traffic_badge').textContent=congested+blocked;
  $('sm_traffic_badge').className='badge ms-1 '+(blocked>0?'badge-danger':congested>0?'badge-warning':'badge-success');
  var details=r.data.congested_details||[],blockages=r.data.blockages||[];
  var html='';for(var i=0;i<blockages.length;i++){html+='<div class="mb-1"><span class="traffic-dot blocked"></span><b>阻塞:</b> '+esc(blockages[i].edge)+' <small class="text-muted">'+esc(blockages[i].desc||'')+'</small></div>'}$('sm_traffic_status').innerHTML=html||'<p class="text-muted small mb-0">无交通事件</p>';
  if(_smRenderer)_smRenderer.setTraffic(r.data);
}

// ---- Vehicles ----
async function smAddRandomVehicle(){
  if(_smNodes.length<2){toast('节点不足','warning');return}
  var idx1=Math.floor(Math.random()*_smNodes.length),idx2=Math.floor(Math.random()*_smNodes.length);
  if(idx1===idx2)idx2=(idx1+1)%_smNodes.length;
  var path=[_smNodes[idx1].node_id,_smNodes[idx2].node_id];
  var vId='V'+(_smVehicles.length+1);
  var r=await api('/api/smart/vehicles',{method:'POST',body:{vehicle_id:vId,name:'车辆 '+vId,route_path:path,speed_kmh:20+Math.random()*40}});
  if(r.success){_smVehicles.push(r.data.vehicle);smRefreshVehicles();smRefreshVehiclesCanvas();toast('车辆 '+vId+' 已添加','success')}
  else toast('添加失败: '+r.message,'error');
}

async function smClearVehicles(){
  for(var i=_smVehicles.length-1;i>=0;i--){await api('/api/smart/vehicles/'+_smVehicles[i].vehicle_id,{method:'DELETE'})}
  _smVehicles=[];smRefreshVehicles();smRefreshVehiclesCanvas();toast('车辆已清空','info');
}

function smRefreshVehicles(){
  $('sm_veh_count').textContent=_smVehicles.length;
  var html='';for(var i=0;i<_smVehicles.length;i++){var v=_smVehicles[i];html+='<div class="vehicle-row"><span><b>'+esc(v.vehicle_id)+'</b> <small class="text-muted">'+esc(v.name||'')+'</small></span><div class="vehicle-bar"><div class="vehicle-bar-fill" style="width:'+(v.progress_pct||0)+'%"></div></div><span class="text-muted small">'+(v.progress_pct||0).toFixed(0)+'%</span><span class="badge '+(v.status==='running'?'badge-success':'badge-warning')+'">'+esc(v.status)+'</span></div>'}$('sm_vehicle_list').innerHTML=html||'<p class="text-muted small mb-0">无车辆</p>';
}

function smRefreshVehiclesCanvas(){
  if(_smRenderer)_smRenderer.setVehicles(_smVehicles);
}

async function smVehicleSimToggle(){

// ---- Real-time Navigation ----
var _smNavActive=false;
async function smStartNavigation(){
  if(!_smStart||!_smGoal){toast('请先设置起点和终点','warning');return}
  _smMode=$('sm_mode').value;
  // First find a path
  var r=await api('/api/smart/path',{method:'POST',body:{start:_smStart,goal:_smGoal,transport_mode:_smMode,algorithm:_smAlgo,heuristic:_smHeuristic,scene_id:_smSceneId}});
  if(!r.success||!r.data.result.is_reachable){toast('无法规划路径','error');return}
  var path=r.data.result.path;
  // Start navigation
  var nr=await api('/api/smart/navigation/start',{method:'POST',body:{planned_path:path,goal_id:_smGoal,transport_mode:_smMode,scene_id:_smSceneId}});
  if(!nr.success){toast('导航启动失败: '+nr.message,'error');return}
  _smNavActive=true;$('sm_nav_start_btn').style.display='none';$('sm_nav_stop_btn').style.display='block';
  toast('实时导航已启动! 目标: '+_smGoal,'success');
}

async function smStopNavigation(){
  await api('/api/smart/navigation/stop',{method:'POST'});_smNavActive=false;
  $('sm_nav_start_btn').style.display='block';$('sm_nav_stop_btn').style.display='none';
  toast('导航已停止','info');
}

// ---- SSE ----
function smConnectSSE(){
  if(_smSSE){_smSSE.close();_smSSE=null}
  _smSSE=new EventSource('/api/smart/navigation/stream');
  _smSSE.addEventListener('init',function(e){var d=JSON.parse(e.data);$('sm_sse_dot').classList.add('connected');$('sm_sse_text').textContent='已连接';console.log('SSE init:',d)});
  _smSSE.addEventListener('heartbeat',function(e){$('sm_sse_dot').classList.add('connected');$('sm_sse_text').textContent='已连接'});
  _smSSE.addEventListener('traffic_update',function(e){var d=JSON.parse(e.data);_smTrafficData=d;smRefreshTrafficUI(d)});
  _smSSE.addEventListener('vehicle_update',function(e){var d=JSON.parse(e.data);_smVehicles=d.vehicles||[];smRefreshVehicles();if(_smRenderer)_smRenderer.setVehicles(_smVehicles)});
  _smSSE.addEventListener('navigation_update',function(e){var d=JSON.parse(e.data);if(d.progress)$('sm_path_len').textContent=d.progress.pct+'%'});
  _smSSE.addEventListener('alert',function(e){var d=JSON.parse(e.data);_smAlerts.unshift(d);if(_smAlerts.length>20)_smAlerts=_smAlerts.slice(0,20);smRefreshAlerts()});
  _smSSE.addEventListener('scene_changed',function(e){var d=JSON.parse(e.data);toast('场景切换: '+d.name,'info')});
  _smSSE.addEventListener('navigation_started',function(e){_smNavActive=true;$('sm_nav_start_btn').style.display='none';$('sm_nav_stop_btn').style.display='block'});
  _smSSE.addEventListener('navigation_stopped',function(e){_smNavActive=false;$('sm_nav_start_btn').style.display='block';$('sm_nav_stop_btn').style.display='none'});
  _smSSE.onerror=function(){$('sm_sse_dot').classList.remove('connected');$('sm_sse_text').textContent='重连中...';setTimeout(function(){if(_smSSE&&_smSSE.readyState===EventSource.CLOSED)smConnectSSE()},3000)};
  toast('SSE流已连接','success');
}

function smRefreshTrafficUI(d){
  var congested=(d.congested_edges||0)+(d.blocked_edges||0);$('sm_traffic_badge').textContent=congested;
  $('sm_traffic_badge').className='badge ms-1 '+(d.blocked_edges>0?'badge-danger':d.congested_edges>0?'badge-warning':'badge-success');
  var blockages=d.blockages||[],html='';for(var i=0;i<blockages.length;i++)html+='<div class="mb-1"><span class="traffic-dot blocked"></span><b>阻塞:</b> '+esc(blockages[i].edge)+'</div>';
  var congestedD=d.congested_details||[];for(var i=0;i<congestedD.length;i++)html+='<div class="mb-1"><span class="traffic-dot '+esc(congestedD[i].level)+'"></span>'+esc(congestedD[i].name||congestedD[i].from+'→'+congestedD[i].to)+' <small class="text-muted">'+esc(congestedD[i].label||'')+'</small></div>';
  $('sm_traffic_status').innerHTML=html||'<p class="text-muted small mb-0">无交通事件</p>';
  if(_smRenderer)_smRenderer.setTraffic(d);
}

function smRefreshAlerts(){
  var html='';for(var i=0;i<Math.min(_smAlerts.length,10);i++){var a=_smAlerts[i];html+='<div class="alert-item '+esc(a.level||'info')+'"><b>'+esc(a.level||'')+'</b> '+esc(a.message||'')+'</div>'}$('sm_alerts').innerHTML=html||'<p class="text-muted small mb-0">无告警</p>';
}

/* ============================================================
   MAP RENDERER (Dark Theme + Accessible Mode)
   ============================================================ */
class MapRenderer{
    constructor(canvas){this.canvas=canvas;this.ctx=canvas.getContext('2d');this.floorData=null;this.state={};this.highlightPath=[];this.nodePositions={};this.scaleX=1;this.scaleY=1;this.offsetX=0;this.offsetY=0;this.accessibleMode=false;this._resize();window.addEventListener('resize',()=>this._resize())}
    _resize(){var dpr=window.devicePixelRatio||1;var rect=this.canvas.getBoundingClientRect();this.canvas.width=rect.width*dpr;this.canvas.height=rect.height*dpr;this.ctx.setTransform(dpr,0,0,dpr,0,0);var pad=30,w=rect.width-pad*2,h=rect.height-pad*2;this.scaleX=w/100;this.scaleY=h/60;this.offsetX=pad;this.offsetY=pad}
    _toPixel(nx,ny){return{x:nx*this.scaleX+this.offsetX,y:ny*this.scaleY+this.offsetY}}
    loadFloor(floorData){this.floorData=floorData;this.state={};this.highlightPath=[];this.nodePositions={};this._computeNodePositions();this.render()}
    setState(nodeStates,path){this.state=nodeStates||{};this.highlightPath=path||[];this.render()}
    setAccessible(mode){this.accessibleMode=mode;this.render()}
    render(){if(!this.floorData)return;var rect=this.canvas.getBoundingClientRect();this.ctx.clearRect(0,0,rect.width,rect.height);this._drawEdges();this._drawNodes();this._drawPathHighlight();this._drawStateOverlay()}
    hitTest(px,py){var rect=this.canvas.getBoundingClientRect(),cx=px-rect.left,cy=py-rect.top;for(var nid in this.nodePositions){var pos=this.nodePositions[nid],dx=cx-pos.x,dy=cy-pos.y;if(Math.sqrt(dx*dx+dy*dy)<14)return nid}return null}
    _computeNodePositions(){for(var i=0;i<this.floorData.nodes.length;i++){var n=this.floorData.nodes[i];this.nodePositions[n.node_id]=this._toPixel(n.x,n.y)}}
    _drawEdges(){var ctx=this.ctx,edges=this.floorData.edges||[];ctx.strokeStyle='rgba(148,163,184,0.25)';ctx.lineWidth=1.5;ctx.beginPath();for(var i=0;i<edges.length;i++){var e=edges[i],p1=this.nodePositions[e[0]],p2=this.nodePositions[e[1]];if(!p1||!p2)continue;ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y)}ctx.stroke()}
    _drawNodes(){for(var i=0;i<this.floorData.nodes.length;i++){var n=this.floorData.nodes[i],p=this.nodePositions[n.node_id];if(!p)continue;this._drawSingleNode(n,p)}}
    _drawSingleNode(node,pos){
        var ctx=this.ctx,state=this.state[node.node_id]||'normal',isStart=state==='start',isGoal=state==='goal';
        var cl={room:'rgba(148,163,184,0.35)',corridor:'rgba(148,163,184,0.2)',stair:'rgba(59,130,246,0.3)',elevator:'rgba(16,185,129,0.3)',entrance:'rgba(239,68,68,0.3)',poi:'rgba(245,158,11,0.3)'};
        var fc=cl[node.node_type]||cl.room,r=10;ctx.save();ctx.translate(pos.x,pos.y);
        if(node.node_type==='corridor'){ctx.fillStyle=fc;ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fill()}
        else if(node.node_type==='stair'){ctx.fillStyle=fc;ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r,0);ctx.lineTo(0,r);ctx.lineTo(-r,0);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(59,130,246,0.5)';ctx.lineWidth=1.5;ctx.stroke()}
        else if(node.node_type==='elevator'){ctx.fillStyle=this.accessibleMode?'rgba(34,197,94,0.35)':fc;ctx.fillRect(-r,-r,r*2,r*2);ctx.strokeStyle=this.accessibleMode?'rgba(34,197,94,0.6)':'rgba(16,185,129,0.5)';ctx.lineWidth=1.5;ctx.strokeRect(-r,-r,r*2,r*2)}
        else if(node.node_type==='poi'){ctx.fillStyle=fc;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(245,158,11,0.5)';ctx.lineWidth=1.5;ctx.stroke()}
        else{var w=r*2.2,h=r*1.6;ctx.fillStyle=fc;this._roundRect(ctx,-w/2,-h/2,w,h,3);ctx.fill();ctx.strokeStyle='rgba(148,163,184,0.3)';ctx.lineWidth=1.2;this._roundRect(ctx,-w/2,-h/2,w,h,3);ctx.stroke()}
        if(isStart||isGoal){ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);ctx.strokeStyle=isStart?'#10b981':'#ef4444';ctx.lineWidth=2.5;ctx.stroke()}
        // Wheelchair icon for elevator nodes in accessible mode
        if(this.accessibleMode&&node.node_type==='elevator'){
          ctx.fillStyle='#22c55e';ctx.font='bold 14px "Microsoft YaHei",Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('♿',0,0);
        }
        var label=node.name.length>12?node.name.slice(0,10)+'…':node.name;ctx.fillStyle='#cbd5e1';ctx.font='9px "Microsoft YaHei",Arial,sans-serif';ctx.textAlign='center';ctx.fillText(label,0,r+13);ctx.restore()
    }
    _drawPathHighlight(){if(this.highlightPath.length<2)return;var ctx=this.ctx;
      ctx.strokeStyle=this.accessibleMode?'#22c55e':'#3b82f6';ctx.lineWidth=3;ctx.lineCap='round';
      ctx.shadowColor=this.accessibleMode?'rgba(34,197,94,0.5)':'rgba(59,130,246,0.5)';ctx.shadowBlur=8;
      ctx.beginPath();for(var i=0;i<this.highlightPath.length;i++){var p=this.nodePositions[this.highlightPath[i]];if(!p)continue;i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)}ctx.stroke();ctx.shadowBlur=0}
    _drawStateOverlay(){var ctx=this.ctx;for(var nid in this.state){var s=this.state[nid];if(s==='start'||s==='goal'||s==='normal'||s==='')continue;var p=this.nodePositions[nid];if(!p)continue;if(s==='visited'){ctx.fillStyle='rgba(59,130,246,0.25)';ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill()}else if(s==='frontier'){ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.stroke()}else if(s==='current'){ctx.fillStyle='rgba(245,158,11,0.5)';ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill()}}}
    _roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath()}
}

/* ============================================================

   ============================================================ */
class AccessibleMapRenderer extends MapRenderer{
    constructor(canvas){super(canvas);this.accessibleMode=true}
}

/* ============================================================
   ANIMATION PLAYER
   ============================================================ */
class AlgorithmAnimator{
    constructor(renderer){this.renderer=renderer;this.steps=[];this.currentStep=-1;this.timerId=null;this.speed=200;this.isPlaying=false;this.finalPath=[]}
    loadSteps(steps,path){this.stop();this.steps=steps||[];this.finalPath=path||[];this.currentStep=-1}
    play(){if(this.steps.length===0)return false;if(this.currentStep>=this.steps.length-1)this.currentStep=-1;this.isPlaying=true;this._scheduleNext();return true}
    pause(){this.isPlaying=false;if(this.timerId){clearTimeout(this.timerId);this.timerId=null}}
    stop(){this.pause();this.currentStep=-1}
    stepForward(){if(this.currentStep<this.steps.length-1){this.currentStep++;this._applyStep(this.currentStep)}}
    stepBackward(){if(this.currentStep>0){this.currentStep--;this._applyStep(this.currentStep)}else if(this.currentStep===0){this.currentStep=-1;this.renderer.setState({},[])}}
    setSpeed(ms){this.speed=Math.max(50,Math.min(2000,ms))}
    _scheduleNext(){if(!this.isPlaying)return;if(this.currentStep<this.steps.length-1){var self=this;this.timerId=setTimeout(function(){self.currentStep++;self._applyStep(self.currentStep);self._scheduleNext()},this.speed)}else{this.isPlaying=false;this._showFinalPath()}}
    _applyStep(index){var step=this.steps[index];if(!step)return;var state={};if(step.visited)for(var i=0;i<step.visited.length;i++)state[step.visited[i]]='visited';if(step.frontier)for(var i=0;i<step.frontier.length;i++){if(state[step.frontier[i]]!=='visited')state[step.frontier[i]]='frontier'}if(step.current)state[step.current]='current';this.renderer.setState(state,[])}
    _showFinalPath(){var state={};for(var i=0;i<this.finalPath.length;i++)state[this.finalPath[i]]='path';this.renderer.setState(state,this.finalPath)}
}
